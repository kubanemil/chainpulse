# Secrets come from the environment: DATABASE_URL, and <NAME>_RPC_URL per chain
# (ETHEREUM_RPC_URL, POLYGON_RPC_URL). The RPC URLs below are keyless public endpoints.

[database]
url = "postgres://chainpulse:chainpulse@localhost:5432/chainpulse"
max_connections = 10   # API pool; each indexer has its own connection

[api]
listen = "0.0.0.0:8080"
max_ws_clients = 100

[[chains]]
id = 1
name = "ethereum"
rpc_url = "https://eth.drpc.org"
confirmations = 64      # two epochs, about 13 minutes
poll_interval_ms = 2000
max_block_range = 500
max_lag_blocks = 5
# start_block = 21000000  # omit to start at the chain head

