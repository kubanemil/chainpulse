[package]
name = "chainpulse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chainpulse-config = { workspace = true }
chainpulse-db = { workspace = true }
chainpulse-types = { workspace = true }
alloy = { workspace = true, features = ["provider-http", "provider-ws", "reqwest", "reqwest-rustls-tls", "rpc-types"] }
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, features = ["contract", "node-bindings", "provider-anvil-api", "signer-local"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sqlx = { workspace = true }
tokio-tungstenite = "0.28"

[lints]
workspace = true
