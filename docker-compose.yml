services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chainpulse
      POSTGRES_PASSWORD: chainpulse
      POSTGRES_DB: chainpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpulse"]
      interval: 2s
      timeout: 3s
      retries: 15

  chainpulse:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chainpulse:chainpulse@postgres:5432/chainpulse
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
